[project]
name = "gigbid"
version = "0.1.0"
description = "Evidence-first freelancer copilot"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "langgraph>=0.6,<2", "mcp>=1,<2", "langchain-mcp-adapters>=0.1,<1", "httpx>=0.27,<1", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "pyyaml>=6,<7", "psycopg[binary]>=3,<4", "redis>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
neural = ["sentence-transformers>=3,<6", "chromadb>=1,<2", "pypdf>=5,<7"]
postgres = ["langgraph-checkpoint-postgres>=2,<4", "psycopg-pool>=3,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "apps*", "data*", "evals*", "mcp_servers*", "rag*"]
exclude = ["tests*", "infra*", "docs*"]
