# Free review deployment. Local SQLite data is ephemeral and resets on restart.
# Free services cannot attach a persistent disk; this file creates no resources.
services:
  - type: web
    name: gigbid
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.deploy
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GIGBID_ENV
        value: production
      - key: GIGBID_MODE
        value: local
      - key: GIGBID_TOOL_BACKEND
        value: mcp
      - key: GIGBID_DATA_DIR
        value: /app/local_data
      - key: GIGBID_API_TOKEN
        generateValue: true
